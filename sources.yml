# Fonti dell'aggregatore ALLCERT.
#
# Campi:
#   id        identificativo breve e univoco (minuscolo, senza spazi)
#   name      nome mostrato nella pagina
#   country   codice Paese a due lettere (EU per le istituzioni europee)
#   kind      csirt | autorita | notizie
#   url       indirizzo del flusso RSS/Atom
#   verified  true = indirizzo confermato su una pagina ufficiale della fonte
#             false = candidato da controllare: guarda status.json dopo la prima esecuzione
#   enabled   (facoltativo) false per sospendere una fonte senza cancellarla
#
# Per aggiungere una fonte basta copiare un blocco e cambiare i valori.

sources:
  # --- Italia ---
  - id: csirt-it
    name: CSIRT Italia (ACN)
    country: IT
    kind: csirt
    url: https://www.acn.gov.it/portale/feedrss/-/journal/rss/20119/723192
    verified: true

  - id: acn-news
    name: ACN - Notizie
    country: IT
    kind: autorita
    url: https://www.acn.gov.it/portale/feedrss
    verified: false
    enabled: false
    # Sospesa: questo indirizzo e' la pagina HTML che elenca i flussi, non un flusso RSS
    # (errore "not well-formed"). Sostituire con l'indirizzo del singolo flusso notizie ACN.

  # --- Istituzioni europee ---
  - id: cert-eu
    name: CERT-EU - Avvisi di sicurezza
    country: EU
    kind: csirt
    url: https://cert.europa.eu/publications/security-advisories-rss
    verified: true

  # --- Germania ---
  - id: cert-bund
    name: CERT-Bund - Avvisi di sicurezza
    country: DE
    kind: csirt
    url: https://wid.cert-bund.de/content/public/securityAdvisory/rss
    verified: true

  - id: cert-bund-buerger
    name: CERT-Bund - Avvisi per i cittadini
    country: DE
    kind: csirt
    url: https://wid.cert-bund.de/content/public/buergercert/rss
    verified: true

  - id: bsi-news
    name: BSI - Stampa e notizie
    country: DE
    kind: autorita
    url: https://www.bsi.bund.de/SiteGlobals/Functions/RSSFeed/RSSNewsfeed/RSSNewsfeed_Presse_Veranstaltungen.xml?nn=910128
    verified: true

  - id: bsi-bits
    name: BSI - Comunicazioni di sicurezza IT
    country: DE
    kind: autorita
    url: https://www.bsi.bund.de/SiteGlobals/Functions/RSSFeed/RSSNewsfeed/RSSNewsfeed_CSW.xml?nn=910128
    verified: true

  # --- Regno Unito ---
  - id: ncsc-uk-news
    name: NCSC UK - Notizie
    country: GB
    kind: autorita
    url: https://www.ncsc.gov.uk/api/1/services/v1/news-rss-feed.xml
    verified: true

  - id: ncsc-uk-reports
    name: NCSC UK - Rapporti sulle minacce
    country: GB
    kind: autorita
    url: https://www.ncsc.gov.uk/api/1/services/v1/report-rss-feed.xml
    verified: true

  # --- Candidati da controllare ---
  - id: cert-fr
    name: CERT-FR
    country: FR
    kind: csirt
    url: https://www.cert.ssi.gouv.fr/feed/
    verified: false

  - id: ncsc-nl
    name: NCSC-NL - Avvisi
    country: NL
    kind: csirt
    url: https://advisories.ncsc.nl/rss/advisories
    verified: false
